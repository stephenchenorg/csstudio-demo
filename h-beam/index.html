<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H型鋼排料系統 — SteelCut Pro</title>
<link href="./vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    /* 紙感底色 */
    --bg: #FAF8F3;              /* --color-paper：頁面背景 */
    --surface: #FFFFFF;         /* --color-card：卡片 */
    --surface2: #F1EFE8;        /* --color-row-alt：表格交錯行／表單區底 */
    --row-hover: #ECE9DE;

    /* 邊框 */
    --border: #D3D1C7;          /* --color-line */
    --border2: #B4B2A9;         /* --color-line-strong */

    /* 墨藍主色 */
    --accent: #042C53;          /* --color-ink：標題列、主按鈕 */
    --accent-hover: #0C447C;    /* --color-ink-hover */
    --accent-light: #E6F1FB;    /* ink 淺色底（tag／focus ring／強調區塊） */
    --accent-soft: #185FA5;     /* --color-ink-soft：連結、focus ring 邊框 */
    --ink-on-dark: #85B7EB;     /* --color-ink-on-dark：深底上的次要文字 */

    /* 語意（損耗分級：<1% good／1~3% 中間級沿用 fg-muted+row-alt／>3% bad） */
    --green: #0F6E56;           /* --color-good */
    --green-light: #E1F5EE;     /* --color-good-bg */
    --red: #993C1D;             /* --color-bad */
    --red-light: #FAECE7;       /* --color-bad-bg */

    /* 文字 */
    --text: #2C2C2A;            /* --color-fg */
    --text2: #5F5E5A;           /* --color-fg-muted */
    --text3: #888780;           /* --color-fg-subtle */

    --shadow: none;
    --shadow-md: 0 2px 8px rgba(4,44,83,0.08);
    --mono: 'IBM Plex Mono', 'Share Tech Mono', monospace;
    --sans: 'Noto Sans TC', sans-serif;
    --display: 'Noto Sans TC', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    font-size: 19px;
  }

  strong { font-weight: 500; }

  .app { max-width: 1520px; margin: 0 auto; padding: 24px; }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 24px;
    box-shadow: var(--shadow);
  }

  .logo { display: flex; align-items: center; gap: 14px; }

  .logo-mark {
    width: 42px; height: 42px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 500; font-size: 26px;
    color: white; letter-spacing: -2px;
  }

  .logo-text h1 {
    font-family: var(--display); font-weight: 500; font-size: 18px;
    color: var(--text); line-height: 1.3;
  }
  .logo-text p { font-size: 12px; color: var(--text3); margin-top: 2px; }

  .header-right { display: flex; gap: 8px; align-items: center; }

  /* LAYOUT */
  .main-grid {
    display: grid;
    grid-template-columns: 480px 1fr;
    gap: 18px; align-items: start;
  }
  @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }

  .left-column {
    background: var(--surface2); border-radius: 8px; padding: 14px;
  }

  /* PANELS */
  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 16px; overflow: hidden;
  }
  .panel:last-child { margin-bottom: 0; }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 18px 11px 15px;
    border-bottom: 0.5px solid var(--border);
    border-left: 3px solid var(--accent);
    background: var(--surface2);
  }

  .panel-title {
    font-family: var(--display); font-weight: 500; font-size: 15px;
    color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }

  .panel-body { padding: 16px 18px; }

  /* FORM ROWS */
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: end; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 13px; font-weight: 400; color: var(--text2); }
  .form-group input, .form-group select {
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--text); font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
    height: 40px; padding: 0 10px; outline: none; transition: all 0.15s;
  }
  .form-group input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(24,95,165,0.12); }

  /* STOCK TAGS */
  .stock-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .stock-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border: 1px solid var(--accent);
    background: var(--accent-light); border-radius: 4px;
    font-family: var(--mono); font-size: 14px; color: var(--accent); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .stock-tag-del {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-size: 16px; line-height: 1;
    padding: 0 2px; opacity: 0.6; transition: opacity 0.15s;
  }
  .stock-tag-del:hover { opacity: 1; }
  .stock-add-row {
    display: flex; gap: 6px; align-items: center; margin-bottom: 10px;
  }
  .stock-add-row input {
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--text); font-family: var(--mono); font-size: 14px;
    font-variant-numeric: tabular-nums;
    height: 40px; padding: 0 10px; width: 160px; outline: none; transition: all 0.15s;
  }
  .stock-add-row input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(24,95,165,0.12); }

  .kerf-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: 6px;
  }
  .kerf-row label { font-size: 13px; color: var(--text2); flex: 1; }
  .kerf-row input {
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--text); font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
    height: 40px; padding: 0 8px; width: 60px; outline: none; text-align: center;
  }
  .kerf-unit { font-size: 12px; color: var(--text3); font-family: var(--mono); }

  /* SPEC GROUP */
  .spec-group {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .spec-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: var(--accent);
    border-bottom: 0.5px solid var(--border);
  }
  .spec-header-title {
    font-family: var(--display); font-weight: 500; font-size: 15px;
    color: #fff;
  }
  .spec-header .btn-ghost {
    color: var(--ink-on-dark); border-color: rgba(255,255,255,0.4);
  }
  .spec-header .btn-ghost:hover {
    color: #fff; border-color: #fff; background: rgba(255,255,255,0.12);
  }
  .spec-header .btn-danger { color: #F4B8A3; }
  .spec-header .btn-danger:hover { color: #fff; }
  .spec-body { padding: 14px 16px; }

  /* PARTS TABLE */
  table { width: 100%; border-collapse: collapse; }

  thead th {
    font-size: 13px; font-weight: 400;
    color: var(--text2);
    padding: 10px 14px; text-align: left;
    border-bottom: 2px solid var(--border);
    background: var(--surface2); white-space: nowrap;
  }

  tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:nth-child(even) { background: var(--surface2); }
  tbody tr:nth-child(even):hover { background: var(--row-hover); }

  tbody td { padding: 6px 8px; vertical-align: middle; }

  tbody td input[type="text"],
  tbody td input[type="number"] {
    background: transparent; border: 1px solid transparent;
    color: var(--text); font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
    padding: 10px 8px; width: 100%; outline: none; transition: all 0.15s;
  }
  tbody td input:focus { background: var(--accent-light); border-color: var(--accent-soft); }
  tbody td input[type="number"] { text-align: right; }

  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text3); padding: 4px 7px; font-size: 17px;
    transition: color 0.15s; border-radius: 4px;
  }
  .del-btn:hover { color: var(--red); background: var(--red-light); }

  /* BUTTONS */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    font-family: var(--sans); font-weight: 500; font-size: 13px;
    padding: 7px 13px; border: none; cursor: pointer;
    transition: all 0.15s; display: inline-flex;
    align-items: center; gap: 5px; border-radius: 4px;
  }

  .btn-ghost {
    background: transparent; border: 1px solid var(--border2); color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .btn-sm {
    font-size: 12px; padding: 5px 10px;
  }

  .btn-danger {
    background: transparent; border: none; color: var(--red);
    padding: 5px 6px; text-decoration: underline; text-underline-offset: 2px;
  }
  .btn-danger:hover { color: #7A2F16; }

  .btn-primary {
    background: var(--accent); color: #fff;
    width: 100%; justify-content: center;
    padding: 12px 16px; font-size: 16px; font-weight: 500;
    margin-top: 12px; border-radius: 4px;
  }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-md); }

  .btn-print {
    background: transparent; border: 1px solid var(--border2); color: var(--text2);
  }
  .btn-print:hover { background: var(--surface2); }

  /* RESULTS EMPTY */
  .results-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 200px; color: var(--text3); font-size: 15px; gap: 10px;
  }
  .results-empty .icon { font-size: 38px; opacity: 0.35; }

  /* STAT CARDS */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface2); border: 1px solid var(--border);
    padding: 12px 14px; position: relative; overflow: hidden;
  }
  .stat-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .stat-top.blue { background: var(--accent); }
  .stat-top.orange { background: var(--accent2); }
  .stat-top.green { background: var(--green); }
  .stat-top.gray { background: var(--text3); }

  .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; color: var(--text); }
  .stat-unit { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* RESULT TABLES */
  .result-spec-section {
    margin-bottom: 20px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .result-spec-section summary {
    cursor: pointer; list-style: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: var(--accent); color: #fff;
    user-select: none;
  }
  .result-spec-section summary::-webkit-details-marker { display: none; }
  .result-spec-section summary::after {
    content: '▾'; font-size: 18px; transition: transform .2s;
  }
  .result-spec-section:not([open]) summary::after { transform: rotate(-90deg); }
  .result-spec-section-body { padding: 16px 20px; }

  .result-spec-block { margin-bottom: 0; }

  .result-spec-header {
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
    padding: 0; margin-bottom: 10px;
    border-bottom: none;
  }
  .result-spec-name {
    font-family: var(--display); font-weight: 500; font-size: 15px;
    color: #fff;
  }
  .result-spec-meta { font-size: 14px; font-family: var(--mono); color: var(--ink-on-dark); }

  .data-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .data-table thead th {
    background: var(--surface2); font-size: 13px; padding: 12px 14px;
    font-weight: 400; color: var(--text2);
    border-bottom: 2px solid var(--border); text-align: right;
    white-space: nowrap;
  }
  .data-table thead th:first-child,
  .data-table thead th:nth-child(3) { text-align: left; }
  .data-table thead th:nth-child(2) { text-align: center; }

  .data-table tbody tr { border-bottom: 0.5px solid var(--border); }
  .data-table tbody tr:hover { background: var(--row-hover); }
  .data-table tbody td {
    padding: 13px 14px; font-family: var(--mono); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .data-table tbody td:first-child { text-align: left; font-weight: 500; }
  .data-table tbody td:nth-child(2) { text-align: center; }
  .data-table tbody td:nth-child(3) { text-align: left; font-family: var(--sans); font-size: 13px; }
  .data-table tbody td:nth-child(5) { text-align: center; }

  .data-table tfoot td {
    padding: 13px 14px; font-family: var(--mono); text-align: right;
    border-top: 2px solid var(--border); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .util-pill {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 12px; font-weight: 500; font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .util-high { background: var(--green-light); color: var(--green); }
  .util-mid { background: var(--surface2); color: var(--text2); }
  .util-low { background: var(--red-light); color: var(--red); }

  /* PROCUREMENT SUMMARY */
  .procurement-block { margin-top: 24px; padding-top: 16px; border-top: 2px solid var(--border); }
  .procurement-title {
    font-family: var(--display); font-weight: 500; font-size: 18px;
    color: var(--text); margin-bottom: 14px;
  }
  .procurement-spec {
    margin-bottom: 12px; padding: 10px 14px;
    background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: 6px;
  }
  .procurement-spec-name {
    font-weight: 500; font-size: 15px; color: var(--accent); margin-bottom: 6px;
  }
  .procurement-item {
    display: flex; gap: 14px; font-family: var(--mono); font-size: 15px;
    font-variant-numeric: tabular-nums;
    padding: 3px 0;
  }
  .procurement-item .stock-label { color: var(--text2); min-width: 50px; }
  .procurement-item .stock-qty { font-weight: 500; color: var(--text); }

  .procurement-totals {
    margin-top: 14px; padding: 12px 16px;
    background: var(--accent-light); border: 1px solid var(--accent);
    border-radius: 6px;
    display: flex; gap: 30px; flex-wrap: wrap;
  }
  .procurement-total-item { display: flex; flex-direction: column; gap: 2px; }
  .procurement-total-label { font-size: 12px; font-weight: 500; color: var(--accent); }
  .procurement-total-value {
    font-family: var(--mono); font-weight: 500; font-size: 26px; color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* CUT DIAGRAMS */
  .section-title {
    font-family: var(--display); font-weight: 500; font-size: 13px;
    color: var(--text2);
    margin-bottom: 8px; margin-top: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .cut-bar {
    margin-bottom: 6px; border: 0.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden; transition: box-shadow 0.15s;
  }
  .cut-bar:hover { box-shadow: var(--shadow-md); }

  .cut-bar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px;
    background: var(--surface2); border-bottom: 0.5px solid var(--border);
  }
  .cut-bar-id { font-family: var(--mono); font-size: 13px; color: var(--text2); font-weight: 500; }
  .cut-bar-meta { font-size: 13px; color: var(--text2); font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .cut-visual { display: flex; height: 44px; width: 100%; overflow: hidden; gap: 1px; }

  .cut-piece {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; font-family: var(--mono); font-size: 13px;
    font-variant-numeric: tabular-nums;
    font-weight: 400; overflow: hidden; white-space: nowrap; cursor: default;
    transition: filter 0.15s; line-height: 1.25;
    border-left: 3px solid currentColor;
    border-right: 1px solid rgba(255,255,255,0.7);
  }
  .cut-piece:last-child { border-right: none; }
  .cut-piece:hover { filter: brightness(0.96); }
  .cut-piece-code { font-size: 13px; font-weight: 500; }

  .cut-waste {
    background: repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 3px,var(--surface) 3px,var(--surface) 9px);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text3); font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    border-left: 1px dashed var(--border2);
  }

  /* 依零件代號配色，同代號必定同色（見 getPartColor） */
  .part-color-0 { background: #E6F1FB; color: #0C447C; }
  .part-color-1 { background: #E1F5EE; color: #085041; }
  .part-color-2 { background: #FAEEDA; color: #633806; }
  .part-color-3 { background: #EEEDFE; color: #3C3489; }
  .part-color-4 { background: #FAECE7; color: #712B13; }
  .part-color-5 { background: #F1EFE8; color: #444441; }

  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .running { animation: pulse 0.9s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.45} }

  .scroll-area { max-height: 440px; overflow-y: auto; padding-right: 2px; }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-track { background: var(--bg); }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    .panel, .spec-group { box-shadow: none; overflow: visible; }
    .scroll-area { max-height: none; overflow: visible; }
    .main-grid { grid-template-columns: 1fr; }
    .result-spec-section, .result-spec-section-body { overflow: visible; }
    .cut-bar { overflow: visible; break-inside: avoid; page-break-inside: avoid; }
    .cut-visual { overflow: visible; }
    table tr, .data-table tr { break-inside: avoid; page-break-inside: avoid; }

    /* 深墨藍標題列吃墨面積大，改成白底黑框黑字 */
    .spec-header, .result-spec-section summary {
      background: #fff !important; color: #000 !important;
      border: 1px solid #000;
    }
    .spec-header-title, .result-spec-name { color: #000 !important; }
    .result-spec-meta { color: #333 !important; }

    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    .cut-visual { height: 38px; }
    .cut-piece {
      font-size: 11px; line-height: 1.15;
      background: #fff !important; color: #000 !important;
      border-left: 3px solid #000; border-right: 1px solid #000;
    }
    .cut-piece-code { font-size: 12px; }
    .cut-waste { color: #333 !important; }
    .util-pill { border: 1px solid rgba(0,0,0,0.2); }
  }
</style>
<script src="./vendor/solver.global.js"></script>
<script src="./vendor/xlsx.bundle.min.js"></script>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-mark">H</div>
      <div class="logo-text">
        <h1>SteelCut Pro</h1>
        <p>H 型鋼排料優化系統</p>
      </div>
    </div>
    <div class="header-right no-print">
      <button class="btn btn-print" onclick="window.print()">&#x23FB; 列印報告</button>
    </div>
  </div>

  <div class="main-grid">

    <!-- LEFT: INPUT -->
    <div class="no-print left-column">

      <!-- Project Info + Global Settings -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">專案 / 全域設定</span>
        </div>
        <div class="panel-body">
          <div class="form-row">
            <div class="form-group">
              <label>案號</label>
              <input type="text" id="projectId" value="" style="width:90px">
            </div>
            <div class="form-group" style="flex:1">
              <label>工程名稱</label>
              <input type="text" id="projectName" value="" style="width:100%">
            </div>
          </div>

          <div style="font-size:13px;font-weight:400;color:var(--text2);margin-bottom:8px;margin-top:6px;">可用定尺料 (mm)</div>
          <div class="stock-tags" id="stockTags"></div>
          <div class="stock-add-row">
            <input type="number" id="stockAddInput" step="1" min="1">

<script>
// =====================================================
//  DATA MODEL
// =====================================================

let stockLengths = [9000, 10000, 12000];

let specs = [];
let specIdCounter = 0;
let partIdCounter = 0;
let latestResults = null;

const PART_COLORS = ['part-color-0','part-color-1','part-color-2','part-color-3','part-color-4','part-color-5'];
const partColorMap = {};
function getPartColor(code) {
  if (!partColorMap[code]) {
    const used = Object.keys(partColorMap).length;
    partColorMap[code] = PART_COLORS[used % PART_COLORS.length];
  }
  return partColorMap[code];
}

// =====================================================
//  STOCK TAGS (user can add/remove freely)
// =====================================================

function renderStockTags() {
  const container = document.getElementById('stockTags');
  container.innerHTML = '';
  stockLengths.sort((a, b) => a - b).forEach(s => {
    const tag = document.createElement('span');
    tag.className = 'stock-tag';
    tag.innerHTML = `${s.toLocaleString()}<button class="stock-tag-del" onclick="removeStock(${s})" title="移除">&times;</button>`;
    container.appendChild(tag);
  });
  if (!stockLengths.length) {
    container.innerHTML = '<span style="font-size:13px;color:var(--text3)">尚未新增定尺料</span>';
  }
}

function addStock(len) {
  if (len > 0 && !stockLengths.includes(len)) {
    stockLengths.push(len);
    renderStockTags();
  }
}

function removeStock(len) {
  stockLengths = stockLengths.filter(s => s !== len);
  renderStockTags();
}

function addStockFromInput() {
  const input = document.getElementById('stockAddInput');
  const val = parseInt(input.value);
  if (!val || val <= 0) return;
  addStock(val);
  input.value = '';
  input.focus();
}

// Allow Enter key to add stock
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('stockAddInput');
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') addStockFromInput(); });
});

// =====================================================
//  SPEC GROUP UI
// =====================================================

function addSpec(name = '', unitWeight = '', material = 'SN', parts = []) {
  const id = ++specIdCounter;
  specs.push({ id, name, unitWeight, material, parts: [] });
  if (parts.length) {
    parts.forEach(p => addPart(id, p.name, p.length, p.qty));
  } else {
    addPart(id);
  }
  renderSpecs();
}

function loadDemoData() {
  specs = [];
  specIdCounter = 0;
  addSpec('H194*150*6*9', '36.7', 'SN', [
    { name: 'A1', length: '8700', qty: '1' },
    { name: 'A1', length: '8940', qty: '1' },
    { name: 'A1', length: '2150', qty: '1' },
    { name: 'A1', length: '1240', qty: '1' },
    { name: 'A1', length: '9360', qty: '1' },
    { name: 'A1', length: '2540', qty: '2' },
    { name: 'A1', length: '6910', qty: '1' },
    { name: 'A1', length: '2160', qty: '1' },
    { name: 'A1', length: '2530', qty: '1' },
    { name: 'A1', length: '2560', qty: '9' },
  ]);
}

function removeSpec(specId) {
  specs = specs.filter(s => s.id !== specId);
  renderSpecs();
}

function updateSpec(specId, field, value) {
  const s = specs.find(s => s.id === specId);
  if (s) s[field] = value;
}

function addPart(specId, name = '', length = '', qty = '') {
  const s = specs.find(s => s.id === specId);
  if (s) {
    s.parts.push({ id: ++partIdCounter, name, length, qty });
    renderSpecs();
  }
}

function removePart(specId, partId) {
  const s = specs.find(s => s.id === specId);
  if (s) {
    s.parts = s.parts.filter(p => p.id !== partId);
    renderSpecs();
  }
}

function updatePart(specId, partId, field, value) {
  const s = specs.find(s => s.id === specId);
  if (s) {
    const p = s.parts.find(p => p.id === partId);
    if (p) p[field] = value;
  }
}

function exportSpec(specId) {
  const s = specs.find(s => s.id === specId);
  if (!s) return;
  const data = { name: s.name, unitWeight: s.unitWeight, material: s.material, parts: s.parts.map(p => ({ name: p.name, length: p.length, qty: p.qty })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${s.name || '型鋼規格'}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importSpec(specId, file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const s = specs.find(s => s.id === specId);
      if (!s) return;
      s.name = data.name || '';
      s.unitWeight = data.unitWeight || '';
      s.material = data.material || 'SN';
      s.parts = [];
      if (data.parts && data.parts.length) {
        data.parts.forEach(p => {
          s.parts.push({ id: ++partIdCounter, name: p.name || '', length: p.length || '', qty: p.qty || '' });
        });
      }
      renderSpecs();
    } catch (err) {
      alert('匯入失敗：檔案格式不正確');
    }
  };
  reader.readAsText(file);
}

function triggerImportSpec(specId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = () => { if (input.files[0]) importSpec(specId, input.files[0]); };
  input.click();
}

function renderSpecs() {
  const container = document.getElementById('specGroups');
  container.innerHTML = '';

  specs.forEach((spec, si) => {
    const div = document.createElement('div');
    div.className = 'spec-group';
    div.innerHTML = `
      <div class="spec-header">
        <span class="spec-header-title">型鋼規格 #${si + 1}</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="triggerImportSpec(${spec.id})">單筆匯入</button>
          <button class="btn btn-ghost btn-sm" onclick="exportSpec(${spec.id})">單筆匯出</button>
          <button class="btn btn-danger btn-sm" onclick="removeSpec(${spec.id})">移除</button>
        </div>
      </div>
      <div class="spec-body">
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <label>規格名稱</label>
            <input type="text" value="${spec.name}" style="width:100%"
              onchange="updateSpec(${spec.id},'name',this.value)">
          </div>
          <div class="form-group">
            <label>單位重 (kg/m)</label>
            <input type="number" value="${spec.unitWeight}" step="0.1" style="width:90px;text-align:right"
              onchange="updateSpec(${spec.id},'unitWeight',this.value)">
          </div>
          <div class="form-group">
            <label>材質</label>
            <input type="text" value="${spec.material}" style="width:60px;text-align:center"
              onchange="updateSpec(${spec.id},'material',this.value)">
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th width="26">#</th>
              <th>代號</th>
              <th style="text-align:right">長度 (mm)</th>
              <th style="text-align:right">數量</th>
              <th width="28"></th>
            </tr>
          </thead>
          <tbody>
            ${spec.parts.map((p, pi) => `
              <tr>
                <td><span style="font-family:var(--mono);color:var(--text3);font-size:12px">${String(pi + 1).padStart(2, '0')}</span></td>
                <td><input type="text" value="${p.name}"                  onchange="updatePart(${spec.id},${p.id},'name',this.value)"></td>
                <td><input type="number" value="${p.length}" step="1" min="0"
                  onchange="updatePart(${spec.id},${p.id},'length',this.value)" style="text-align:right"></td>
                <td><input type="number" value="${p.qty}" step="1" min="1"
                  onchange="updatePart(${spec.id},${p.id},'qty',this.value)" style="text-align:right;width:50px"></td>
                <td><button class="del-btn" onclick="removePart(${spec.id},${p.id})">&#xD7;</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" onclick="addPart(${spec.id})">+ 新增零件</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });

  // Excel-style keyboard navigation for parts table
  container.addEventListener('keydown', function(e) {
    const input = e.target;
    if (input.tagName !== 'INPUT') return;
    const td = input.closest('td');
    const tr = input.closest('tr');
    if (!td || !tr) return;
    const tbody = tr.closest('tbody');
    if (!tbody) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      const colIdx = Array.from(tr.children).indexOf(td);
      const rows = Array.from(tbody.rows);
      const rowIdx = rows.indexOf(tr);
      if (rowIdx < rows.length - 1) {
        const nextInput = rows[rowIdx + 1].children[colIdx]?.querySelector('input');
        if (nextInput) nextInput.focus();
      }
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const cells = Array.from(tr.querySelectorAll('td input'));
      const idx = cells.indexOf(input);
      if (e.shiftKey) {
        if (idx > 0) cells[idx - 1].focus();
      } else {
        if (idx < cells.length - 1) cells[idx + 1].focus();
      }
    }
  });
}

// =====================================================
//  DEMO DATA (matches customer Excel)
// =====================================================


// =====================================================
//  ALGORITHM (multi-start search for minimum total stock)
// =====================================================

function generatePatterns(sizes, stockLen, kerf) {
  const results = [];
  function recurse(idx, rem, cur) {
    if (idx === sizes.length) {
      if (cur.some(c => c > 0)) results.push([...cur]);
      return;
    }
    const s = sizes[idx];
    const maxN = Math.floor(rem / (s + kerf));
    for (let n = 0; n <= maxN; n++) {
      cur[idx] = n;
      recurse(idx + 1, rem - n * (s + kerf), cur);
    }
    cur[idx] = 0;
  }
  recurse(0, stockLen, new Array(sizes.length).fill(0));
  return results;
}

// Maximal patterns only: those where no remaining length can still fit.
// Used by the ILP path because non-maximal patterns are dominated and
// only inflate the integer search space.
function generateMaximalPatterns(sizes, stockLen, kerf) {
  const results = [];
  const minSize = Math.min(...sizes);
  function recurse(idx, rem, cur) {
    if (idx === sizes.length) {
      if (cur.some(c => c > 0) && rem < minSize + kerf) results.push([...cur]);
      return;
    }
    const s = sizes[idx];
    const maxN = Math.floor(rem / (s + kerf));
    for (let n = 0; n <= maxN; n++) {
      cur[idx] = n;
      recurse(idx + 1, rem - n * (s + kerf), cur);
    }
    cur[idx] = 0;
  }
  recurse(0, stockLen, new Array(sizes.length).fill(0));
  return results;
}

function patternUsed(pattern, sizes, kerf) {
  let total = 0, cnt = 0;
  for (let i = 0; i < pattern.length; i++) {
    if (pattern[i] > 0) {
      total += pattern[i] * sizes[i];
      cnt += pattern[i];
    }
  }
  total += cnt * kerf;
  return total;
}

// Exact solver: integer linear programming via javascript-lp-solver.
// Skip when problem structure is known to blow up branch-and-bound:
//  - More than 10 distinct lengths: search tree depth explodes regardless of
//    pattern count (observed: 11 lengths + short stock = 90s+ hang).
//  - More than 1500 maximal patterns: too many integer variables.
// Maximal patterns dominate non-maximal ones for min-cost cutting stock,
// so we only enumerate those — typically ~25% of the full pattern set.
function solveILP(distinctLens, demand, stocks, kerf) {
  if (typeof solver === 'undefined') return null;
  if (distinctLens.length > 10) return null;

  const allPatterns = [];
  for (const stock of stocks) {
    for (const counts of generateMaximalPatterns(distinctLens, stock, kerf)) {
      const used = patternUsed(counts, distinctLens, kerf);
      if (used <= stock) allPatterns.push({ stock, counts, used });
    }
  }
  if (!allPatterns.length || allPatterns.length > 1500) return null;

  const model = { optimize: 'cost', opType: 'min', constraints: {}, variables: {}, ints: {} };
  distinctLens.forEach(len => { model.constraints['L' + len] = { min: demand[len] }; });
  allPatterns.forEach((p, i) => {
    const v = { cost: p.stock };
    distinctLens.forEach((len, j) => { if (p.counts[j] > 0) v['L' + len] = p.counts[j]; });
    model.variables['p' + i] = v;
    model.ints['p' + i] = 1;
  });

  let res;
  try { res = solver.Solve(model); }
  catch (e) { console.warn('ILP error, falling back to heuristic:', e); return null; }
  if (!res || !res.feasible) return null;

  const bins = [];
  allPatterns.forEach((p, i) => {
    const n = Math.round(res['p' + i] || 0);
    for (let k = 0; k < n; k++) {
      bins.push({ stock: p.stock, counts: [...p.counts], usedLength: p.used, waste: p.stock - p.used });
    }
  });
  return bins.length ? bins : null;
}

// Fallback: multi-start heuristic search (used when solver is unavailable
// or pattern explosion exceeds the ILP cap).
function solveHeuristic(distinctLens, demand, stocks, kerf) {
  const allPatterns = [];
  for (const stock of stocks) {
    for (const counts of generatePatterns(distinctLens, stock, kerf)) {
      const used = patternUsed(counts, distinctLens, kerf);
      if (used <= stock) {
        allPatterns.push({
          stock, counts, used,
          waste: stock - used,
          totalPieces: counts.reduce((s, v) => s + v, 0),
          util: used / stock,
        });
      }
    }
  }
  allPatterns.sort((a, b) => b.util - a.util || b.totalPieces - a.totalPieces);

  function getMaxTimes(pat, dem) {
    let t = Infinity;
    for (let i = 0; i < distinctLens.length; i++) {
      if (pat.counts[i] > 0) {
        const avail = dem[distinctLens[i]] || 0;
        if (avail < pat.counts[i]) return 0;
        t = Math.min(t, Math.floor(avail / pat.counts[i]));
      }
    }
    return t === Infinity ? 0 : t;
  }
  function applyN(pat, dem, n) {
    const d = { ...dem };
    for (let i = 0; i < distinctLens.length; i++)
      d[distinctLens[i]] = (d[distinctLens[i]] || 0) - pat.counts[i] * n;
    return d;
  }
  function demandEmpty(dem) { return distinctLens.every(l => (dem[l] || 0) <= 0); }
  function makeBins(pat, n) {
    return Array.from({ length: n }, () => ({
      stock: pat.stock, counts: [...pat.counts], waste: pat.waste, usedLength: pat.used,
    }));
  }
  function runGreedy(dem) {
    const bins = [];
    const rem = { ...dem };
    while (!demandEmpty(rem)) {
      let applied = false;
      for (const ap of allPatterns) {
        const mt = getMaxTimes(ap, rem);
        if (mt > 0) {
          bins.push(...makeBins(ap, mt));
          for (let i = 0; i < distinctLens.length; i++)
            rem[distinctLens[i]] -= ap.counts[i] * mt;
          applied = true;
          break;
        }
      }
      if (!applied) {
        for (const stock of stocks) {
          const bin = { stock, counts: new Array(distinctLens.length).fill(0), waste: 0, usedLength: 0 };
          let r = stock;
          for (let i = 0; i < distinctLens.length; i++) {
            while ((rem[distinctLens[i]] || 0) > 0 && r >= distinctLens[i] + kerf) {
              bin.counts[i]++;
              rem[distinctLens[i]]--;
              r -= (distinctLens[i] + kerf);
            }
          }
          if (bin.counts.some(c => c > 0)) {
            bin.usedLength = stock - r;
            bin.waste = r;
            bins.push(bin);
            applied = true;
            break;
          }
        }
        if (!applied) break;
      }
    }
    return bins;
  }
  function totalStock(bins) { return bins.reduce((s, b) => s + b.stock, 0); }

  let bestTotal = Infinity;
  let bestBins = null;
  function tryCandidate(bins) {
    const t = totalStock(bins);
    if (t < bestTotal) { bestTotal = t; bestBins = bins; }
  }

  tryCandidate(runGreedy({ ...demand }));

  const TOP1 = Math.min(allPatterns.length, 30);
  for (let i = 0; i < TOP1; i++) {
    const fp = allPatterns[i];
    const mt = getMaxTimes(fp, demand);
    if (mt <= 0) continue;
    const dem1 = applyN(fp, demand, mt);
    tryCandidate([...makeBins(fp, mt), ...runGreedy(dem1)]);
  }

  for (let i = 0; i < TOP1; i++) {
    const fp = allPatterns[i];
    if (getMaxTimes(fp, demand) < 1) continue;
    const dem1 = applyN(fp, demand, 1);
    const TOP2 = Math.min(allPatterns.length, 15);
    for (let j = 0; j < TOP2; j++) {
      const sp = allPatterns[j];
      const mt2 = getMaxTimes(sp, dem1);
      if (mt2 <= 0) continue;
      const dem2 = applyN(sp, dem1, mt2);
      tryCandidate([...makeBins(fp, 1), ...makeBins(sp, mt2), ...runGreedy(dem2)]);
    }
  }
  return bestBins;
}

function optimizeSpec(parts, stockLengths, kerf) {
  const demand = {};
  parts.forEach(p => {
    const len = parseFloat(p.length);
    const qty = parseInt(p.qty) || 0;
    if (len > 0 && qty > 0) demand[len] = (demand[len] || 0) + qty;
  });

  const distinctLens = Object.keys(demand).map(Number).sort((a, b) => b - a);
  if (!distinctLens.length) return [];

  const stocks = [...stockLengths].sort((a, b) => b - a);

  const bestBins = solveILP(distinctLens, demand, stocks, kerf)
                || solveHeuristic(distinctLens, demand, stocks, kerf);

  // Post-process: assign part names and build cut combos
  const namePool = {};
  parts.forEach(p => {
    const len = parseFloat(p.length);
    const qty = parseInt(p.qty) || 0;
    if (len > 0 && qty > 0) {
      if (!namePool[len]) namePool[len] = [];
      for (let i = 0; i < qty; i++) namePool[len].push(p.name);
    }
  });

  bestBins.forEach(bin => {
    bin.pieces = [];
    for (let i = 0; i < distinctLens.length; i++) {
      for (let k = 0; k < bin.counts[i]; k++) {
        const name = (namePool[distinctLens[i]] && namePool[distinctLens[i]].length)
          ? namePool[distinctLens[i]].shift() : '?';
        bin.pieces.push({ name, length: distinctLens[i] });
      }
    }
    const lengthGroups = {};
    bin.pieces.forEach(p => { lengthGroups[p.length] = (lengthGroups[p.length] || 0) + 1; });
    const sortedLens = Object.keys(lengthGroups).map(Number).sort((a, b) => b - a);
    bin.cutCombo = sortedLens.map(l => {
      const cnt = lengthGroups[l];
      return cnt > 1 ? `${l}*${cnt}` : String(l);
    }).join(' + ');
    bin.cutCount = bin.pieces.length;
    delete bin.counts;
  });

  bestBins.sort((a, b) => b.stock - a.stock || b.usedLength - a.usedLength);
  return bestBins;
}

function optimizeAll() {
  const sl = [...stockLengths].sort((a, b) => a - b);
  const kerf = parseFloat(document.getElementById('kerfInput').value) || 3;

  if (!sl.length) { alert('請至少新增一種定尺料長度'); return null; }

  const results = [];

  for (const spec of specs) {
    const validParts = spec.parts.filter(p => parseFloat(p.length) > 0 && parseInt(p.qty) > 0);
    if (!validParts.length) continue;

    const unitWeight = parseFloat(spec.unitWeight) || 0;
    const bins = optimizeSpec(validParts, sl, kerf);

    // Calculate weights
    let cutWeightTotal = 0;
    let purchaseWeightTotal = 0;

    bins.forEach(bin => {
      const stockM = bin.stock / 1000;
      const usedM = bin.usedLength / 1000;
      const wasteM = bin.waste / 1000;
      bin.purchaseWeight = stockM * unitWeight;
      bin.cutWeight = usedM * unitWeight;
      bin.wasteWeight = wasteM * unitWeight;
      bin.wastePercent = bin.stock > 0 ? (bin.waste / bin.stock * 100) : 0;
      cutWeightTotal += bin.cutWeight;
      purchaseWeightTotal += bin.purchaseWeight;
    });

    // Procurement count by stock length
    const procurement = {};
    bins.forEach(bin => {
      procurement[bin.stock] = (procurement[bin.stock] || 0) + 1;
    });

    results.push({
      spec: {
        name: spec.name || `規格 #${spec.id}`,
        unitWeight,
        material: spec.material || 'SN',
      },
      bins,
      cutWeightTotal,
      purchaseWeightTotal,
      procurement,
    });
  }

  return results;
}

// =====================================================
//  RUN & RENDER
// =====================================================

function runOptimize() {
  const panel = document.getElementById('resultsPanel');
  const meta = document.getElementById('resultMeta');
  panel.innerHTML =
    '<div class="results-empty"><div class="icon running">&#x2699;&#xFE0F;</div><div>計算中…</div></div>';
  meta.textContent = '計算中…';

  // Double rAF so the "計算中" message actually paints before the
  // synchronous solver locks the main thread.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const results = optimizeAll();
    const btn = document.getElementById('exportBtn');
    if (!results || !results.length) {
      panel.innerHTML =
        '<div class="results-empty"><div class="icon">&#x26A0;&#xFE0F;</div><div>請至少輸入一組型鋼規格及零件</div></div>';
      meta.textContent = '等待計算';
      latestResults = null;
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
      return;
    }
    latestResults = results;
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
    renderResults(results);
  }));
}

// pct = 損耗率（waste %），依三級分色：<1% 佳／1~3% 普通／>3% 偏高
function utilClass(wastePct) {
  return wastePct < 1 ? 'util-high' : wastePct <= 3 ? 'util-mid' : 'util-low';
}

// =====================================================
//  EXCEL EXPORT
// =====================================================

function exportToExcel() {
  if (!latestResults || !latestResults.length) {
    alert('請先計算後再匯出');
    return;
  }
  if (typeof XLSX === 'undefined') {
    alert('xlsx 函式庫載入失敗，請確認 vendor/xlsx.bundle.min.js 存在');
    return;
  }

  const projectId = document.getElementById('projectId').value || '';
  const projectName = document.getElementById('projectName').value || '';
  const kerf = parseFloat(document.getElementById('kerfInput').value) || 3;
  const results = latestResults;

  const thinBorder = { style: 'thin', color: { rgb: '808080' } };
  const fullBorder = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

  const aoa = [];
  const cellStyles = {};
  const merges = [];
  const rowHeights = {};
  const colLetter = (i) => String.fromCharCode(65 + i);
  const ref = (r0, c0) => `${colLetter(c0)}${r0 + 1}`;

  // Row 1: title at D1, merged D1:G1
  aoa.push(['', '', '', '型鋼採購建議單', '', '', '']);
  cellStyles['D1'] = {
    font: { bold: true, sz: 18 },
    alignment: { horizontal: 'center', vertical: 'center' },
  };
  merges.push({ s: { r: 0, c: 3 }, e: { r: 0, c: 6 } });

  // Row 2: empty
  aoa.push([]);

  // Row 3: project + kerf
  aoa.push(['案號:', projectId, '工程名稱:', projectName, '', '', '', '', '切割損耗:', kerf, 'mm']);
  ['A3', 'C3', 'I3'].forEach(r => { cellStyles[r] = { font: { bold: true }, alignment: { horizontal: 'right' } }; });
  cellStyles['B3'] = { font: { bold: true } };
  cellStyles['D3'] = { font: { bold: true } };
  cellStyles['J3'] = { alignment: { horizontal: 'center' } };

  // Row 4: empty
  aoa.push([]);

  // Row 5: header (merge C5:G5 for cutCombo)
  aoa.push(['定尺料規格(mm)', '數量', '切割長度組合(mm)', '', '', '', '', '切割總支數', '材質', '長度(mm)', '重量(kg)', '損耗(kg)', '%', '剩餘長度(mm)']);
  ['A', 'B', 'C', 'H', 'I', 'J', 'K', 'L', 'M', 'N'].forEach(c => {
    cellStyles[`${c}5`] = {
      font: { bold: true },
      fill: { fgColor: { rgb: 'F2F2F2' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: fullBorder,
    };
  });
  merges.push({ s: { r: 4, c: 2 }, e: { r: 4, c: 6 } });

  // Row 6: empty
  aoa.push([]);

  let r = 6; // current 0-indexed row

  results.forEach((spec, si) => {
    // Spec header row
    aoa.push([`＊型鋼規格 #${si + 1}:`, spec.spec.name, '單位重:', spec.spec.unitWeight, 'kg/m']);
    cellStyles[ref(r, 0)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 1)] = { font: { bold: true, color: { rgb: '1A56DB' } } };
    cellStyles[ref(r, 2)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 3)] = { alignment: { horizontal: 'center' } };
    r++;

    // Requested parts (input BOM)
    const reqParts = specs[si] ? specs[si].parts : [];
    if (reqParts.length) {
      aoa.push(['需求零件清單']);
      cellStyles[ref(r, 0)] = { font: { bold: true, sz: 12 } };
      r++;

      aoa.push(['代號', '長度(mm)', '數量']);
      ['A', 'B', 'C'].forEach(c => {
        cellStyles[`${c}${r + 1}`] = {
          font: { bold: true },
          fill: { fgColor: { rgb: 'F2F2F2' } },
          alignment: { horizontal: 'center', vertical: 'center' },
          border: fullBorder,
        };
      });
      r++;

      reqParts.forEach(p => {
        aoa.push([p.name, Number(p.length), Number(p.qty)]);
        ['A', 'B', 'C'].forEach(c => {
          cellStyles[`${c}${r + 1}`] = {
            border: fullBorder,
            alignment: { horizontal: c === 'A' ? 'left' : 'right', vertical: 'center' },
          };
        });
        r++;
      });

      // Spacer
      aoa.push([]);
      r++;
    }

    // Color map for the cut-diagram bar (mirrors the on-screen 切割示意圖 colors)
    const COLOR_HEX = ['BFDBFE', 'BBF7D0', 'FED7AA', 'E9D5FF', 'FDE68A', 'A5F3FC', 'FECACA', 'D1FAE5'];
    const WASTE_HEX = 'E5E7EB';
    const allLens = [...new Set(spec.bins.flatMap(b => b.pieces.map(p => p.length)))].sort((a, b) => b - a);
    const colorMapHex = {};
    allLens.forEach((l, i) => { colorMapHex[l] = COLOR_HEX[i % COLOR_HEX.length]; });
    const BAR_COLS = 12; // squeezed into columns O:Z, proportional to piece length

    // Bin rows
    spec.bins.forEach(bin => {
      aoa.push([
        bin.stock, 1, bin.cutCombo, '', '', '', '',
        bin.cutCount, spec.spec.material, bin.usedLength,
        +bin.purchaseWeight.toFixed(1), +bin.wasteWeight.toFixed(1),
        +bin.wastePercent.toFixed(2), bin.waste,
      ]);
      const align = { A: 'right', B: 'center', C: 'left', H: 'center', I: 'center', J: 'right', K: 'right', L: 'right', M: 'center', N: 'right' };
      Object.keys(align).forEach(c => {
        cellStyles[`${c}${r + 1}`] = { border: fullBorder, alignment: { horizontal: align[c], vertical: 'center' } };
      });
      cellStyles[ref(r, 2)] = { border: fullBorder, alignment: { horizontal: 'left', vertical: 'center', wrapText: true } };
      merges.push({ s: { r, c: 2 }, e: { r, c: 6 } });
      // cutCombo can be long (many cut pieces); wrap + grow row height so it isn't truncated
      const comboLines = Math.ceil((bin.cutCombo || '').length / 55) || 1;
      rowHeights[r] = Math.max(20, comboLines * 16 + 6);
      r++;

      // Proportional colored bar row — the Excel equivalent of the on-screen 切割示意圖
      let units = bin.pieces.map(p => Math.max(1, Math.round(p.length / bin.stock * BAR_COLS)));
      let sumUnits = units.reduce((a, b) => a + b, 0);
      while (sumUnits > BAR_COLS) {
        const maxIdx = units.indexOf(Math.max(...units));
        if (units[maxIdx] <= 1) break;
        units[maxIdx]--; sumUnits--;
      }
      const wasteUnits = Math.max(0, BAR_COLS - sumUnits);

      const barRow = new Array(26).fill('');
      aoa.push(barRow);
      let col = 14; // column O
      bin.pieces.forEach((p, pi) => {
        for (let u = 0; u < units[pi] && col <= 25; u++, col++) {
          cellStyles[ref(r, col)] = { fill: { fgColor: { rgb: colorMapHex[p.length] } }, border: fullBorder };
        }
      });
      for (let u = 0; u < wasteUnits && col <= 25; u++, col++) {
        cellStyles[ref(r, col)] = { fill: { fgColor: { rgb: WASTE_HEX } }, border: fullBorder };
      }
      rowHeights[r] = 12;
      r++;
    });

    // Cut weight summary
    aoa.push(['', '', '', '', '', '', '', '', '', '切割重量:', +spec.cutWeightTotal.toFixed(1), 'kg']);
    cellStyles[ref(r, 9)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 10)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    r++;

    // Purchase weight summary
    aoa.push(['', '', '', '', '', '', '', '', '', '購買重量:', +spec.purchaseWeightTotal.toFixed(1), 'kg']);
    cellStyles[ref(r, 9)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 10)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    r++;

    // Spacer
    aoa.push([]);
    r++;
  });

  // Procurement totals header
  aoa.push(['購買總數量']);
  cellStyles[ref(r, 0)] = { font: { bold: true, sz: 14 } };
  r++;

  let totalCutWeight = 0, totalPurchaseWeight = 0, totalBars = 0;
  results.forEach(spec => {
    totalCutWeight += spec.cutWeightTotal;
    totalPurchaseWeight += spec.purchaseWeightTotal;
    totalBars += spec.bins.length;

    aoa.push([spec.spec.name]);
    cellStyles[ref(r, 0)] = { font: { bold: true, color: { rgb: '1A56DB' } } };
    r++;

    const sortedStocks = Object.keys(spec.procurement).map(Number).sort((a, b) => b - a);
    sortedStocks.forEach(stock => {
      const label = stock >= 1000 ? (stock / 1000) + 'M' : stock + 'mm';
      aoa.push([label, spec.procurement[stock], '支']);
      cellStyles[ref(r, 0)] = { alignment: { horizontal: 'center' } };
      cellStyles[ref(r, 1)] = { alignment: { horizontal: 'right' } };
      r++;
    });
  });

  // Spacer
  aoa.push([]);
  r++;

  // Grand totals
  const grandTotals = [
    ['切割總重量:', +totalCutWeight.toFixed(1), 'kg'],
    ['購買總重量:', +totalPurchaseWeight.toFixed(1), 'kg'],
    ['購買總支數:', totalBars, '支'],
  ];
  grandTotals.forEach(row => {
    aoa.push(['', '', '', row[0], '', row[1], row[2]]);
    cellStyles[ref(r, 3)] = { font: { bold: true }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 5)] = { font: { bold: true, sz: 13 }, alignment: { horizontal: 'right' } };
    cellStyles[ref(r, 6)] = { font: { bold: true } };
    r++;
  });

  // Build worksheet
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = [
    { wch: 16 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 },
    { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 14 },
    // O:Z — narrow columns used only for the proportional cut-diagram bar row
    ...Array(12).fill({ wch: 6 }),
  ];
  const maxRow = aoa.length;
  ws['!rows'] = [{ hpx: 32 }];
  for (let ri2 = 1; ri2 < maxRow; ri2++) {
    ws['!rows'][ri2] = rowHeights[ri2] ? { hpx: rowHeights[ri2] } : undefined;
  }

  Object.keys(cellStyles).forEach(addr => {
    if (ws[addr]) ws[addr].s = cellStyles[addr];
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '採購建議單');

  const today = new Date();
  const ymd = today.getFullYear() +
    String(today.getMonth() + 1).padStart(2, '0') +
    String(today.getDate()).padStart(2, '0');
  const filename = projectId
    ? `型鋼採購建議單_${projectId}_${ymd}.xlsx`
    : `型鋼採購建議單_${ymd}.xlsx`;

  XLSX.writeFile(wb, filename);
}

function renderResults(results) {
  // reset so this render's part codes get colors from the top of the cycle
  Object.keys(partColorMap).forEach(k => delete partColorMap[k]);

  const projectId = document.getElementById('projectId').value || '';
  const projectName = document.getElementById('projectName').value || '';
  const kerf = document.getElementById('kerfInput').value || '3';

  let totalCutWeight = 0;
  let totalPurchaseWeight = 0;
  let totalBars = 0;

  let html = '';

  // Project header
  if (projectId || projectName) {
    html += `<div style="margin-bottom:16px;font-size:15px;color:var(--text2)">
      <strong>型鋼採購建議單</strong>
      ${projectId ? `&emsp;案號: <strong>${projectId}</strong>` : ''}
      ${projectName ? `&emsp;工程名稱: <strong>${projectName}</strong>` : ''}
      &emsp;切割損耗: <strong>${kerf} mm</strong>
    </div>`;
  }

  // Per-spec results
  results.forEach((r, ri) => {
    totalCutWeight += r.cutWeightTotal;
    totalPurchaseWeight += r.purchaseWeightTotal;
    totalBars += r.bins.length;

    html += `<details class="result-spec-section" open>
    <summary>
      <div class="result-spec-header">
        <span class="result-spec-name">型鋼規格 #${ri + 1}&emsp;${r.spec.name}</span>
        <span class="result-spec-meta">單位重: ${r.spec.unitWeight} kg/m &emsp;|&emsp; ${r.bins.length} 支母材</span>
      </div>
    </summary>
    <div class="result-spec-section-body">
    <div class="result-spec-block">`;

    // Requested parts (input BOM) table
    const reqParts = specs[ri] ? specs[ri].parts : [];
    if (reqParts.length) {
      html += `<div class="section-title">需求零件清單</div>`;
      html += `<table class="data-table">
        <thead><tr>
          <th style="text-align:left">代號</th>
          <th>長度(mm)</th>
          <th>數量</th>
        </tr></thead>
        <tbody>`;
      reqParts.forEach(p => {
        html += `<tr>
          <td style="text-align:left">${p.name}</td>
          <td>${Number(p.length).toLocaleString()}</td>
          <td>${p.qty}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }

    // Main data table (Excel-style)
    if (reqParts.length) html += `<div class="section-title">切割配置</div>`;
    html += `<table class="data-table">
      <thead><tr>
        <th style="text-align:left">定尺料(mm)</th>
        <th>數量</th>
        <th style="text-align:left">切割長度組合(mm)</th>
        <th>切割總支數</th>
        <th>材質</th>
        <th>長度(mm)</th>
        <th>重量(kg)</th>
        <th>損耗(kg)</th>
        <th>%</th>
        <th>剩餘長度(mm)</th>
      </tr></thead>
      <tbody>`;

    r.bins.forEach(bin => {
      html += `<tr>
        <td style="font-weight:500">${bin.stock.toLocaleString()}</td>
        <td style="text-align:center">1</td>
        <td style="text-align:left;font-family:var(--sans);font-size:13px">${bin.cutCombo}</td>
        <td>${bin.cutCount}</td>
        <td style="text-align:center">${r.spec.material}</td>
        <td>${bin.usedLength.toLocaleString()}</td>
        <td>${bin.purchaseWeight.toFixed(1)}</td>
        <td>${bin.wasteWeight.toFixed(1)}</td>
        <td><span class="util-pill ${utilClass(bin.wastePercent)}">${bin.wastePercent.toFixed(2)}</span></td>
        <td>${bin.waste.toLocaleString()}</td>
      </tr>`;
    });

    html += `</tbody>
      <tfoot>
        <tr>
          <td colspan="5"></td>
          <td style="text-align:right;font-size:13px;color:var(--text2)">切割重量:</td>
          <td>${r.cutWeightTotal.toFixed(1)} kg</td>
          <td colspan="3"></td>
        </tr>
        <tr>
          <td colspan="5"></td>
          <td style="text-align:right;font-size:13px;color:var(--text2)">購買重量:</td>
          <td>${r.purchaseWeightTotal.toFixed(1)} kg</td>
          <td colspan="3"></td>
        </tr>
      </tfoot>
    </table>`;

    // Cut diagrams
    html += `<div class="section-title">切割示意圖</div>`;
    html += `<div class="scroll-area">`;

    r.bins.forEach((bin, idx) => {
      html += `<div class="cut-bar">
        <div class="cut-bar-header">
          <span class="cut-bar-id">母材 #${String(idx + 1).padStart(3, '0')} - ${bin.stock.toLocaleString()}mm</span>
          <span class="cut-bar-meta">${bin.cutCount} 支 | 廢料 ${bin.waste}mm</span>
        </div>
        <div class="cut-visual">`;

      bin.pieces.forEach(piece => {
        const pct = (piece.length / bin.stock * 100).toFixed(2);
        const cls = getPartColor(piece.name);
        const pctNum = parseFloat(pct);
        const label = pctNum > 10
          ? `<span class="cut-piece-code">${piece.name}</span>${piece.length}`
          : (pctNum > 7 ? piece.length : '');
        html += `<div class="cut-piece ${cls}" style="width:${pct}%" title="${piece.name} ${piece.length}mm">
          ${label}
        </div>`;
      });

      if (bin.waste > 0) {
        const wPct = (bin.waste / bin.stock * 100).toFixed(2);
        html += `<div class="cut-waste" style="width:${wPct}%">
          ${parseFloat(wPct) > 4 ? bin.waste + 'mm' : ''}
        </div>`;
      }

      html += `</div></div>`;
    });

    html += `</div>`;

    // Per-spec procurement
    html += `<div class="procurement-block">
      <div class="procurement-title">購買數量</div>
      <div class="procurement-spec">
        <div class="procurement-spec-name">${r.spec.name}</div>`;

    const sortedStocks = Object.keys(r.procurement).map(Number).sort((a, b) => b - a);
    sortedStocks.forEach(stock => {
      const label = stock >= 1000 ? (stock / 1000) + 'M' : stock + 'mm';
      html += `<div class="procurement-item">
        <span class="stock-label">${label}</span>
        <span class="stock-qty">${r.procurement[stock]} 支</span>
      </div>`;
    });

    html += `</div></div>`;

    html += `</div></div></details>`;
  });

  // Grand totals
  html += `<div class="procurement-block" style="margin-top:24px;">
    <div class="procurement-title" style="font-size:18px;">購買總數量</div>`;

  results.forEach(r => {
    const specBars = r.bins.length;
    html += `<div class="procurement-spec">
      <div class="procurement-spec-name">${r.spec.name}</div>`;
    const sortedStocks = Object.keys(r.procurement).map(Number).sort((a, b) => b - a);
    sortedStocks.forEach(stock => {
      const label = stock >= 1000 ? (stock / 1000) + 'M' : stock + 'mm';
      html += `<div class="procurement-item">
        <span class="stock-label">${label}</span>
        <span class="stock-qty">${r.procurement[stock]} 支</span>
      </div>`;
    });
    html += `<div class="procurement-totals" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);">
      <div class="procurement-total-item">
        <span class="procurement-total-label">切割重量</span>
        <span class="procurement-total-value">${r.cutWeightTotal.toFixed(1)} <span style="font-size:14px;font-weight:400">kg</span></span>
      </div>
      <div class="procurement-total-item">
        <span class="procurement-total-label">購買重量</span>
        <span class="procurement-total-value">${r.purchaseWeightTotal.toFixed(1)} <span style="font-size:14px;font-weight:400">kg</span></span>
      </div>
      <div class="procurement-total-item">
        <span class="procurement-total-label">購買支數</span>
        <span class="procurement-total-value">${specBars} <span style="font-size:14px;font-weight:400">支</span></span>
      </div>
    </div>`;
    html += `</div>`;
  });

  html += `<div class="procurement-totals" style="margin-top:16px;padding-top:16px;border-top:2px solid var(--border);">
    <div class="procurement-total-item">
      <span class="procurement-total-label">切割總重量</span>
      <span class="procurement-total-value">${totalCutWeight.toFixed(1)} <span style="font-size:14px;font-weight:400">kg</span></span>
    </div>
    <div class="procurement-total-item">
      <span class="procurement-total-label">購買總重量</span>
      <span class="procurement-total-value">${totalPurchaseWeight.toFixed(1)} <span style="font-size:14px;font-weight:400">kg</span></span>
    </div>
    <div class="procurement-total-item">
      <span class="procurement-total-label">購買總支數</span>
      <span class="procurement-total-value">${totalBars} <span style="font-size:14px;font-weight:400">支</span></span>
    </div>
  </div>`;

  html += `</div>`;

  document.getElementById('resultsPanel').innerHTML = html;
  document.getElementById('resultMeta').textContent = `共 ${results.length} 組規格，${totalBars} 支`;
}
