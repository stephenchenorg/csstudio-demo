name: Build h-beam Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: h-beam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      # 只快取 Cargo registry，不快取 src-tauri/target。
      # target 快取會讓 Tauri 沿用舊的內嵌資源（restore-keys 前綴比對會撈到舊 target），
      # 導致 index.html / vendor 改了卻沒被重新打包進 App。
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('h-beam/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install pake-cli
        shell: bash
        run: |
          npm init -y > /dev/null
          npm install pake-cli --no-fund --no-audit

      # pake 不加 --use-local-file 時只會複製 index.html 單檔，vendor/ 不會進包
      # （桌機版 xlsx / solver / 字型全部 404）。改成準備一個乾淨的來源目錄再整包帶走，
      # 避免 --use-local-file 把 node_modules 一起複製進去。
      - name: Prepare build source
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src
          cp index.html build-src/
          cp -R vendor build-src/vendor
          ls -la build-src build-src/vendor

      # --app-version 讀 package.json，否則 App 內顯示的永遠是 pake 預設的 1.0.0，
      # 客戶回報問題時無從判斷手上裝的是哪一版。
      - name: Build MSI
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "building version $VERSION"
          npx pake ./build-src/index.html --name "SteelCut Pro" --width 1520 --height 900 --use-local-file --app-version "$VERSION"

      # 打包後 pake 的 web root 就是 node_modules/pake-cli/dist，
      # 缺任何一個 vendor 檔案代表這版桌機 App 又會壞掉，直接讓 build 失敗。
      - name: Verify vendor assets were bundled
        shell: bash
        run: |
          root="node_modules/pake-cli/dist"
          fail=0
          for f in index.html vendor/xlsx.bundle.min.js vendor/solver.global.js vendor/fonts/fonts.css; do
            if [ -f "$root/$f" ]; then
              echo "OK   $f"
            else
              echo "MISS $f"
              fail=1
            fi
          done
          exit $fail

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SteelCut-Pro-Windows
          path: h-beam/SteelCut Pro.msi
          if-no-files-found: error
