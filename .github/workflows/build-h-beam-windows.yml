name: Build h-beam Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: h-beam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: h-beam/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # 只快取 Cargo registry，不快取 src-tauri/target。
      # target 快取會讓 Tauri 沿用舊的內嵌資源（restore-keys 前綴比對會撈到舊 target），
      # 導致 index.html / vendor 改了卻沒被重新打包進 App。
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('h-beam/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # package.json / package-lock.json 已經有 pake-cli，用 npm ci 裝就好。
      # 原本的 npm init -y + npm install pake-cli 會改寫 package.json，
      # 而且每次都重新解析相依，曾經卡住 38 分鐘。
      - name: Install pake-cli
        shell: bash
        run: npm ci --no-fund --no-audit

      # pake 不加 --use-local-file 時只會複製 index.html 單檔，vendor/ 不會進包
      # （桌機版 xlsx / solver / 字型全部 404）。改成準備一個乾淨的來源目錄再整包帶走，
      # 避免 --use-local-file 把 node_modules 一起複製進去。
      - name: Prepare build source
        shell: bash
        run: |
          rm -rf build-src
          mkdir -p build-src
          cp index.html build-src/
          cp -R vendor build-src/vendor
          ls -la build-src build-src/vendor

      # --app-version 讀 package.json，否則 App 內顯示的永遠是 pake 預設的 1.0.0，
      # 客戶回報問題時無從判斷手上裝的是哪一版。
      - name: Build MSI
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "building version $VERSION"
          npx pake ./build-src/index.html --name "SteelCut Pro" --width 1520 --height 900 --use-local-file --app-version "$VERSION"

      # 直接檢查產出的 exe：Tauri 把前端資源內嵌進 binary，檔名會以明文留在 asset table
      # （內容本身經 brotli 壓縮，所以只驗檔名）。缺任何一個代表這版桌機 App 又會壞掉。
      - name: Verify vendor assets were bundled
        shell: bash
        run: |
          echo "--- pake-cli web root ---"
          ls -la node_modules/pake-cli/dist/ || true
          ls -la node_modules/pake-cli/dist/vendor/ || true
          EXE=$(find node_modules/pake-cli/src-tauri/target -path "*release*" -name "*.exe" \
            -not -path "*deps*" -not -path "*build*" -not -path "*incremental*" | head -1)
          echo "--- 檢查 $EXE ---"
          if [ -z "$EXE" ]; then echo "找不到產出的 exe"; exit 1; fi
          fail=0
          for f in xlsx.bundle.min.js solver.global.js fonts.css; do
            if grep -q -a -F "$f" "$EXE"; then echo "OK   $f"; else echo "MISS $f"; fail=1; fi
          done
          exit $fail

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SteelCut-Pro-Windows
          path: h-beam/SteelCut Pro.msi
          if-no-files-found: error
